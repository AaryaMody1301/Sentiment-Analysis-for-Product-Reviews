[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "product-review-sentiment"
version = "1.0.0"
description = "Evidence-first product-review sentiment analysis with explicit label contracts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["sentiment-analysis", "nlp", "scikit-learn", "streamlit", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = [
  "nltk>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.8,<2",
  "skops==0.14.0",
  "streamlit>=1.62,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
benchmark = ["datasets==5.0.1"]

[project.urls]
Repository = "https://github.com/AaryaMody1301/Sentiment-Analysis-for-Product-Reviews"
Issues = "https://github.com/AaryaMody1301/Sentiment-Analysis-for-Product-Reviews/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
